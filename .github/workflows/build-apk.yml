name: Generate Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/actions-setup-node@v4
        with:
          node-version: 18

      - name: Build Android Package via PWABuilder CLI
        run: |
          npm install -g @pwabuilder/pwabuilder-cli
          # آپ یہاں اپنی ہوسٹ کی گئی ویب سائٹ کا لائیو URL یا لوکل پاتھ دے سکتے ہیں
          pwabuilder package --url https://your-app-url.com --platforms android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed.apk
          path: android/app/build/outputs/apk/release/
