<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasbeeh Pro Max</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --gold: #fbbf24;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.8);
            --accent: #059669;
            --accent-glow: rgba(5, 150, 105, 0.3);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: rgba(0, 0, 0, 0.08);
            --gold: #d97706;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; background-image: radial-gradient(circle at top, var(--accent-glow) 0%, transparent 40%); }
        .app-container { width: 100%; max-width: 480px; background: var(--card-bg); backdrop-filter: blur(12px); min-height: 100vh; display: flex; flex-direction: column; border-left: 1px solid var(--border); border-right: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.3); position: relative; }

        .screen { display: none; flex-direction: column; flex: 1; padding: 16px; padding-bottom: 50px; }
        .screen.active { display: flex; }

        .top-bar, .nav-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .app-title { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
        .tools { display: flex; gap: 8px; align-items: center; }

        select.lang-select { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 13px; outline: none; cursor: pointer; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-primary); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

        .stats-card { background: linear-gradient(135deg, var(--accent), #047857); color: white; padding: 16px; border-radius: 16px; margin-bottom: 14px; text-align: center; box-shadow: 0 8px 20px var(--accent-glow); }
        .stat-num { font-size: 28px; font-weight: 800; display: block; }

        .search-box input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); font-size: 14px; outline: none; margin-bottom: 12px; }

        .dhikr-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; max-height: 48vh; }
        .dhikr-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .dhikr-item:hover { border-color: var(--accent); transform: translateY(-2px); }
        .dhikr-item .info h3 { font-size: 16px; margin-bottom: 4px; color: var(--text-primary); }
        .dhikr-item .info p { font-size: 12px; color: var(--text-secondary); }
        .badge { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; }

        .card-detail { background: var(--card-bg); border-radius: 16px; padding: 14px; border: 1px solid var(--border); margin-bottom: 10px; max-height: 200px; overflow-y: auto; text-align: center; }
        .arabic-text { font-size: 22px; line-height: 1.8; color: var(--gold); font-weight: 600; margin-bottom: 8px; direction: rtl; }
        .trans-block { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; line-height: 1.4; }

        /* Target Quick Buttons Row */
        .target-chips { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
        .chip { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-secondary); padding: 4px 10px; font-size: 12px; border-radius: 15px; cursor: pointer; font-weight: 600; }
        .chip.active, .chip:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .counter-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ring-container { position: relative; width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring-circle { transition: stroke-dashoffset 0.25s ease; stroke-dasharray: 440; stroke-dashoffset: 440; }
        .counter-content { position: absolute; text-align: center; }
        .count-number { font-size: 44px; font-weight: 800; color: var(--text-primary); }
        .count-target { font-size: 12px; color: var(--text-secondary); }

        .action-row { display: flex; gap: 8px; width: 100%; margin-top: 15px; }
        .btn-sub { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-danger { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); outline: none; font-size: 13px; }
        .form-group textarea { height: 65px; resize: none; }
        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 6px 15px var(--accent-glow); margin-top: 5px; }

        .backup-bar { display: flex; gap: 8px; margin-top: 8px; }
        .btn-sm { flex: 1; padding: 8px; font-size: 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); cursor: pointer; text-align: center; }

        .footer-credit { position: absolute; bottom: 8px; left: 0; width: 100%; text-align: center; font-size: 11px; color: var(--text-secondary); font-weight: 600; }
        .footer-credit span { color: var(--gold); font-weight: 700; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <span class="app-title" id="appTitle">📿 Tasbeeh Pro</span>
        <div class="tools">
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ur">اردو</option>
                <option value="ar">العربية</option>
                <option value="tr">Türkçe</option>
            </select>
            <button class="icon-btn" id="soundToggle" onclick="toggleSound()">🔊</button>
            <button class="icon-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <!-- 1. List Screen -->
    <div id="list-screen" class="screen active">
        <div class="stats-card">
            <div class="stat-box"><span class="stat-num" id="totalCountDisplay">0</span><span id="labelTotal">Total Count</span></div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search Dhikr..." oninput="filterList()">
        </div>
        <div class="dhikr-list" id="dhikrListContainer"></div>
        
        <div class="backup-bar">
            <button type="button" class="btn-sm" onclick="exportData()">💾 Backup</button>
            <button type="button" class="btn-sm" onclick="importData()">📂 Restore</button>
        </div>
    </div>

    <!-- 2. Detail Screen -->
    <div id="detail-screen" class="screen">
        <div class="nav-bar">
            <button type="button" class="icon-btn" onclick="showScreen('list-screen')">←</button>
            <div class="tools">
                <button class="icon-btn" onclick="changeFontSize(2)">A+</button>
                <button class="icon-btn" onclick="changeFontSize(-2)">A-</button>
            </div>
        </div>
        <div class="card-detail">
            <div class="arabic-text" id="detailArabic"></div>
            <div class="trans-block" id="detailTrans"></div>
            <div class="trans-block" id="detailBenefit"></div>
        </div>

        <!-- Quick Target Selector Bar -->
        <div class="target-chips" id="targetChipsBar">
            <span class="chip" onclick="setQuickTarget(7)">7</span>
            <span class="chip" onclick="setQuickTarget(10)">10</span>
            <span class="chip" onclick="setQuickTarget(33)">33</span>
            <span class="chip" onclick="setQuickTarget(100)">100</span>
            <span class="chip" onclick="setQuickTarget(500)">500</span>
            <span class="chip" onclick="setQuickTarget(1000)">1000</span>
        </div>

        <div class="counter-section">
            <div class="ring-container" onclick="handleTap()">
                <svg class="progress-ring" width="170" height="170">
                    <circle stroke="rgba(255,255,255,0.1)" stroke-width="10" fill="transparent" r="70" cx="85" cy="85"/>
                    <circle class="progress-ring-circle" id="progressCircle" stroke="#10b981" stroke-width="10" stroke-linecap="round" fill="transparent" r="70" cx="85" cy="85"/>
                </svg>
                <div class="counter-content">
                    <div class="count-number" id="countDisplay">0</div>
                    <div class="count-target" id="targetDisplay">Target: 33</div>
                </div>
            </div>
            <div class="action-row">
                <button type="button" class="btn-sub" id="resetBtnText" onclick="resetCurrentCount()">Reset</button>
                <button type="button" class="btn-sub" id="editBtnText" onclick="editCurrentDhikr()" style="display:none;">Edit Custom</button>
            </div>
        </div>
    </div>

    <!-- 3. Form Screen for Custom Dhikr Editing -->
    <div id="add-screen" class="screen">
        <div class="nav-bar">
            <button type="button" class="icon-btn" onclick="showScreen('list-screen')">←</button>
            <h3 id="formHeading">Edit Custom Dhikr</h3>
        </div>
        <div class="form-group"><label>Title</label><input type="text" id="customTitle"></div>
        <div class="form-group"><label>Arabic</label><textarea id="customArabic"></textarea></div>
        <div class="form-group"><label>Translation</label><textarea id="customTrans"></textarea></div>
        <div class="form-group"><label>Benefit</label><input type="text" id="customBenefit"></div>
        <div class="form-group"><label>Default Target</label><input type="number" id="customTarget" value="33"></div>
        <button type="button" class="btn-primary" id="saveBtnText" onclick="saveDhikr()">Save Changes</button>
    </div>

    <!-- Credit Footer -->
    <div class="footer-credit">
        Developed by <span>Burhan Ahmad Mughal</span>
    </div>
</div>

<script>
const uiTranslations = {
    en: { title: "📿 Tasbeeh Pro", search: "🔍 Search Dhikr...", target: "Target", reset: "Reset", edit: "Edit Custom", save: "Save Changes", totalLbl: "Total Lifetime Count", transLbl: "Translation: ", benefitLbl: "Benefit: " },
    ur: { title: "📿 تسبیح پرو", search: "🔍 ذکر تلاش کریں...", target: "ہدف", reset: "ری سیٹ", edit: "ترمیم کریں", save: "محفوظ کریں", totalLbl: "کل تسبیحات (Total Count)", transLbl: "ترجمہ: ", benefitLbl: "فائدہ: " },
    ar: { title: "📿 التسبيح الذكي", search: "🔍 بحث عن الذكر...", target: "الهدف", reset: "إعادة ضبط", edit: "تعديل", save: "حفظ", totalLbl: "المجموع الكلي", transLbl: "الترجمة: ", benefitLbl: "الفائدة: " },
    tr: { title: "📿 Zikirmatik Pro", search: "🔍 Zikir Ara...", target: "Hedef", reset: "Sıfırla", edit: "Düzenle", save: "Kaydet", totalLbl: "Toplam Zikir", transLbl: "Anlamı: ", benefitLbl: "Fazileti: " }
};

let currentLang = 'en', soundEnabled = true, fontSize = 22;

// Default Dhikrs + 3 Dedicated Custom Dhikr Slots
const defaultDhikrs = [
    { id: 1, title: { en: "Ayat al-Kursi", ur: "آیۃ الکرسی", ar: "آية الكرسي", tr: "Ayet'el Kürsi" }, arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...", trans: { en: "Allah! There is no deity except Him...", ur: "اللہ! اس کے سوا کوئی معبود نہیں...", ar: "الله لا إله إلا هو الحي القيوم...", tr: "Allah, O'ndan başka ilah yoktur..." }, benefit: { en: "Protection from all evil.", ur: "ہر شر سے حفاظت۔", ar: "الحماية من كل شر.", tr: "Kötülükten koruma." }, target: 1 },
    { id: 2, title: { en: "Surah Al-Ikhlas", ur: "سورۃ الاخلاص", ar: "سورة الإخلاص", tr: "İhlas Suresi" }, arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ", trans: { en: "Say, 'He is Allah, One.'", ur: "کہہ دیجیے، وہ اللہ ایک ہے۔", ar: "قل هو الله أحد", tr: "De ki: O Allah tektir." }, benefit: { en: "Reward of 1/3 Quran.", ur: "تہائی قرآن کا ثواب۔", ar: "عدل ثلث القرآن.", tr: "Kur'an'ın 1/3'ine denk." }, target: 3 },
    { id: 3, title: { en: "SubhanAllah", ur: "سبحان اللہ", ar: "سبحان الله", tr: "Sübhanallah" }, arabic: "سُبْحَانَ اللَّهِ", trans: { en: "Glory be to Allah.", ur: "اللہ پاک ہے۔", ar: "تنزيه الله عن كل نقص.", tr: "Allah münezzehtir." }, benefit: { en: "Tree planted in Paradise.", ur: "جنت میں درخت۔", ar: "غرس نخلة في الجنة.", tr: "Cennette ağaç." }, target: 33 },
    { id: 4, title: { en: "Alhamdulillah", ur: "الحمد للہ", ar: "الحمد لله", tr: "Elhamdülillah" }, arabic: "الْحَمْدُ لِلَّهِ", trans: { en: "Praise be to Allah.", ur: "تمام تعریفیں اللہ کے لیے ہیں۔", ar: "الثناء والحمد لله.", tr: "Övgü Allah'a mahsustur." }, benefit: { en: "Fills the scale.", ur: "ترازو بھر دیتا ہے۔", ar: "تملأ الميزان.", tr: "Tartıyı doldurur." }, target: 33 },
    { id: 5, title: { en: "Allahu Akbar", ur: "اللہ اکبر", ar: "الله أكبر", tr: "Allahü Ekber" }, arabic: "اللَّهُ أَكْبَرُ", trans: { en: "Allah is the Greatest.", ur: "اللہ سب سے بڑا ہے۔", ar: "الله أعظم وأكبر.", tr: "Allah en büyüktür." }, benefit: { en: "High spiritual status.", ur: "بلند درجات۔", ar: "رفعة الدرجات.", tr: "Yüksek dereceler." }, target: 34 },
    // 3 Custom Dhikr Slots
    { id: 101, isCustomSlot: true, title: "⭐ Custom Dhikr 1", arabic: "أستغفر الله", trans: "I seek forgiveness from Allah", benefit: "Forbearance and mercy", target: 100 },
    { id: 102, isCustomSlot: true, title: "⭐ Custom Dhikr 2", arabic: "لا حول ولا قوة إلا بالله", trans: "There is no power except with Allah", benefit: "Treasure of Paradise", target: 100 },
    { id: 103, isCustomSlot: true, title: "⭐ Custom Dhikr 3", arabic: "اللهم صل على محمد", trans: "Blessings upon Prophet Muhammad", benefit: "Salawat blessings", target: 100 }
];

let allDhikrs = [], activeDhikrId = null, editingId = null;
let counts = {}, customSlotsData = {};
let customTargets = {}; // Remembers custom target per dhikr

function getData(key) {
    try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : null;
    } catch(e) { return null; }
}

function setData(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

function init() {
    counts = getData('my_counts') || {};
    customSlotsData = getData('custom_slots') || {};
    customTargets = getData('custom_targets') || {};

    allDhikrs = defaultDhikrs.map(d => {
        if (d.isCustomSlot && customSlotsData[d.id]) {
            return { ...d, ...customSlotsData[d.id] };
        }
        return d;
    });

    renderList(allDhikrs);
    updateTotalCount();
}

function renderList(list) {
    const container = document.getElementById('dhikrListContainer');
    if (!container) return;
    container.innerHTML = '';
    list.forEach(item => {
        const titleText = typeof item.title === 'object' ? (item.title[currentLang] || item.title['en']) : item.title;
        const currentTarget = customTargets[item.id] || item.target;
        const div = document.createElement('div');
        div.className = 'dhikr-item';
        div.onclick = () => openDhikrDetail(item.id);
        div.innerHTML = `<div class="info"><h3>${titleText}</h3><p>${uiTranslations[currentLang].target}: ${currentTarget}</p></div><div class="badge">${counts[item.id] || 0}</div>`;
        container.appendChild(div);
    });
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function openDhikrDetail(id) {
    activeDhikrId = id;
    const dhikr = allDhikrs.find(d => d.id === id);
    if(!dhikr) return;
    
    const transText = typeof dhikr.trans === 'object' ? (dhikr.trans[currentLang] || dhikr.trans['en']) : dhikr.trans;
    const benefitText = typeof dhikr.benefit === 'object' ? (dhikr.benefit[currentLang] || dhikr.benefit['en']) : dhikr.benefit;

    document.getElementById('detailArabic').innerText = dhikr.arabic || '';
    document.getElementById('detailTrans').innerText = transText ? uiTranslations[currentLang].transLbl + transText : '';
    document.getElementById('detailBenefit').innerText = benefitText ? uiTranslations[currentLang].benefitLbl + benefitText : '';
    
    const editBtn = document.getElementById('editBtnText');
    if (dhikr.isCustomSlot) {
        editBtn.style.display = 'block';
    } else {
        editBtn.style.display = 'none';
    }

    updateCounterDisplay();
    showScreen('detail-screen');
}

function setQuickTarget(val) {
    if (!activeDhikrId) return;
    customTargets[activeDhikrId] = val;
    setData('custom_targets', customTargets);
    updateCounterDisplay();
    renderList(allDhikrs);
}

function handleTap() {
    if (!activeDhikrId) return;
    counts[activeDhikrId] = (counts[activeDhikrId] || 0) + 1;
    setData('my_counts', counts);
    if (soundEnabled) playClickSound();
    if (navigator.vibrate) navigator.vibrate(30);
    updateCounterDisplay();
    updateTotalCount();
    renderList(allDhikrs);
}

function updateCounterDisplay() {
    const current = counts[activeDhikrId] || 0;
    const dhikr = allDhikrs.find(d => d.id === activeDhikrId);
    const target = customTargets[activeDhikrId] || (dhikr ? dhikr.target : 33);
    
    document.getElementById('countDisplay').innerText = current;
    document.getElementById('targetDisplay').innerText = `${uiTranslations[currentLang].target}: ${target}`;

    // Highlight active chip
    document.querySelectorAll('.chip').forEach(c => {
        if (parseInt(c.innerText) === target) c.classList.add('active');
        else c.classList.remove('active');
    });

    const circle = document.getElementById('progressCircle');
    if(circle && circle.r) {
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - Math.min(current / target, 1) * circumference;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = offset;
    }
}

function updateTotalCount() {
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    document.getElementById('totalCountDisplay').innerText = total;
}

function resetCurrentCount() {
    if (!activeDhikrId) return;
    counts[activeDhikrId] = 0;
    setData('my_counts', counts);
    updateCounterDisplay();
    updateTotalCount();
    renderList(allDhikrs);
}

function editCurrentDhikr() {
    const dhikr = allDhikrs.find(d => d.id === activeDhikrId);
    if(!dhikr || !dhikr.isCustomSlot) return;
    editingId = dhikr.id;
    document.getElementById('customTitle').value = typeof dhikr.title === 'object' ? dhikr.title['en'] : dhikr.title;
    document.getElementById('customArabic').value = dhikr.arabic || '';
    document.getElementById('customTrans').value = typeof dhikr.trans === 'object' ? dhikr.trans['en'] : dhikr.trans;
    document.getElementById('customBenefit').value = typeof dhikr.benefit === 'object' ? dhikr.benefit['en'] : dhikr.benefit;
    document.getElementById('customTarget').value = customTargets[editingId] || dhikr.target || 100;
    showScreen('add-screen');
}

function saveDhikr() {
    const title = document.getElementById('customTitle').value.trim();
    if (!title) return alert('Title is required');
    
    const targetVal = parseInt(document.getElementById('customTarget').value) || 100;
    const arabicVal = document.getElementById('customArabic').value;
    const transVal = document.getElementById('customTrans').value;
    const benefitVal = document.getElementById('customBenefit').value;

    customSlotsData[editingId] = { title, arabic: arabicVal, trans: transVal, benefit: benefitVal, target: targetVal };
    customTargets[editingId] = targetVal;

    setData('custom_slots', customSlotsData);
    setData('custom_targets', customTargets);
    init();
    showScreen('detail-screen');
}

function changeLanguage(langKey) {
    currentLang = langKey;
    const t = uiTranslations[langKey];
    document.getElementById('appTitle').innerText = t.title;
    document.getElementById('searchInput').placeholder = t.search;
    document.getElementById('resetBtnText').innerText = t.reset;
    document.getElementById('editBtnText').innerText = t.edit;
    document.getElementById('saveBtnText').innerText = t.save;
    document.getElementById('labelTotal').innerText = t.totalLbl;
    
    renderList(allDhikrs);
    if (activeDhikrId) openDhikrDetail(activeDhikrId);
}

function toggleTheme() {
    const body = document.documentElement;
    const currentTheme = body.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    body.setAttribute('data-theme', newTheme);
    document.getElementById('themeToggle').innerText = newTheme === 'light' ? '☀️' : '🌙';
}

function toggleSound() { 
    soundEnabled = !soundEnabled; 
    document.getElementById('soundToggle').innerText = soundEnabled ? '🔊' : '🔇'; 
}

function changeFontSize(delta) { 
    fontSize = Math.max(16, Math.min(32, fontSize + delta)); 
    document.getElementById('detailArabic').style.fontSize = fontSize + 'px'; 
}

let globalAudioCtx = null;
function playClickSound() {
    try {
        if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (globalAudioCtx.state === 'suspended') globalAudioCtx.resume();
        const osc = globalAudioCtx.createOscillator();
        const gain = globalAudioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, globalAudioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, globalAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, globalAudioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(globalAudioCtx.destination);
        osc.start();
        osc.stop(globalAudioCtx.currentTime + 0.05);
    } catch(e) {}
}

function filterList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderList(allDhikrs.filter(d => {
        const titleText = typeof d.title === 'object' ? (d.title[currentLang] || d.title['en']) : d.title;
        return titleText.toLowerCase().includes(q);
    }));
}

function exportData() {
    const data = { counts, customSlotsData, customTargets };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tasbeeh_backup.json';
    a.click();
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
            try {
                const parsed = JSON.parse(event.target.result);
                if (parsed.counts) setData('my_counts', parsed.counts);
                if (parsed.customSlotsData) setData('custom_slots', parsed.customSlotsData);
                if (parsed.customTargets) setData('custom_targets', parsed.customTargets);
                init();
                alert('Data restored successfully!');
            } catch(err) { alert('Invalid Backup File'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

window.onload = init;
</script>
