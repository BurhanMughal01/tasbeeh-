<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسبیح کاؤنٹر ایپ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0d231a; color: #fff; min-height: 100vh; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; background: #133226; min-height: 100vh; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Navigation & Screens */
        .screen { display: none; flex-direction: column; flex: 1; padding: 16px; }
        .screen.active { display: flex; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #245440; margin-bottom: 15px; }
        .header h1 { font-size: 20px; color: #e0d0b0; }
        .back-btn { background: #245440; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        
        /* List Screen */
        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #245440; background: #0d231a; color: #fff; font-size: 15px; outline: none; }
        .dhikr-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
        .dhikr-item { background: #1c4434; border: 1px solid #2a634d; border-radius: 12px; padding: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .dhikr-item:active { transform: scale(0.98); background: #245440; }
        .dhikr-item .info h3 { font-size: 17px; color: #f4e8d1; margin-bottom: 4px; }
        .dhikr-item .info p { font-size: 12px; color: #a3c4b5; }
        .badge { background: #d4a359; color: #0d231a; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; }
        
        .add-custom-btn { background: #d4a359; color: #0d231a; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; text-align: center; }

        /* Detail & Counter Screen */
        .card-detail { background: #1c4434; border-radius: 16px; padding: 16px; border: 1px solid #2a634d; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
        .arabic-text { font-size: 24px; line-height: 1.8; text-align: center; color: #ffd700; margin-bottom: 12px; direction: rtl; }
        .text-block { font-size: 14px; color: #e0e0e0; margin-bottom: 8px; line-height: 1.5; }
        .text-block strong { color: #d4a359; }

        /* Custom Counter Area (Full Screen Tap) */
        .counter-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .big-tap-area { width: 100%; height: 220px; background: linear-gradient(145deg, #1f4d3b, #15382b); border-radius: 50%; border: 6px solid #d4a359; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.4); user-select: none; transition: transform 0.05s; }
        .big-tap-area:active { transform: scale(0.95); }
        .count-number { font-size: 64px; font-weight: bold; color: #fff; }
        .count-target { font-size: 14px; color: #a3c4b5; margin-top: 5px; }

        .counter-controls { display: flex; gap: 10px; width: 100%; margin-top: 15px; }
        .ctrl-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .reset-btn { background: #a53d3d; color: #fff; }

        /* Form Modal */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #a3c4b5; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #245440; background: #0d231a; color: #fff; outline: none; }
        .form-group textarea { height: 70px; resize: none; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- 1. فہرست کی اسکرین -->
    <div id="list-screen" class="screen active">
        <div class="header">
            <h1>📿 تمام اذکار</h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ذکر تلاش کریں..." oninput="filterList()">
        </div>
        <div class="dhikr-list" id="dhikrListContainer"></div>
        <button class="add-custom-btn" onclick="showScreen('add-screen')">➕ اپنا نیا ذکر شامل کریں</button>
    </div>

    <!-- 2. کاؤنٹر اور تفصیل کی اسکرین -->
    <div id="detail-screen" class="screen">
        <div class="header">
            <button class="back-btn" onclick="showScreen('list-screen')">← واپس جائیں</button>
            <h1 id="detailTitle">ذکر کا نام</h1>
        </div>
        
        <div class="card-detail">
            <div class="arabic-text" id="detailArabic"></div>
            <div class="text-block" id="detailTranslation"></div>
            <div class="text-block" id="detailBenefit"></div>
        </div>

        <div class="counter-section">
            <div class="big-tap-area" onclick="handleTap()">
                <div class="count-number" id="countDisplay">0</div>
                <div class="count-target" id="targetDisplay">ہدف: 0</div>
            </div>
            <div class="counter-controls">
                <button class="ctrl-btn reset-btn" onclick="resetCurrentCount()">ری سیٹ (0)</button>
            </div>
        </div>
    </div>

    <!-- 3. کسٹم ذکر بنانے کی اسکرین -->
    <div id="add-screen" class="screen">
        <div class="header">
            <button class="back-btn" onclick="showScreen('list-screen')">← منسوخ کریں</button>
            <h1>نیا ذکر شامل کریں</h1>
        </div>
        <form onsubmit="saveCustomDhikr(event)">
            <div class="form-group">
                <label>ذکر کا نام</label>
                <input type="text" id="customTitle" required placeholder="مثال: درود شریف">
            </div>
            <div class="form-group">
                <label>عربی متن (یا مکمل سورت)</label>
                <textarea id="customArabic" placeholder="عربی لکھیں..."></textarea>
            </div>
            <div class="form-group">
                <label>اردو ترجمہ</label>
                <textarea id="customTranslation" placeholder="ترجمہ لکھیں..."></textarea>
            </div>
            <div class="form-group">
                <label>فضیلت / فائدہ</label>
                <input type="text" id="customBenefit" placeholder="فائدہ...">
            </div>
            <div class="form-group">
                <label>تجویز کردہ تعداد (Target Count)</label>
                <input type="number" id="customTarget" value="33" min="1" required>
            </div>
            <button type="submit" class="add-custom-btn" style="width: 100%;">محفوظ کریں</button>
        </form>
    </div>

</div>

<script>
    // بنیادی اذکار کا ڈیٹا
    const defaultDhikrs = [
        { id: 1, title: "آیت الکرسی", arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ...", translation: "ترجمہ: اللہ وہ ہے جس کے سوا کوئی معبود نہیں، وہ ہمیشہ زندہ رہنے والا ہے...", benefit: "فضل: شیطان اور ہر آفت سے مکمل حفاظت۔", target: 1 },
        { id: 2, title: "سورۃ الاخلاص", arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", translation: "ترجمہ: کہہ دیجیے کہ وہ اللہ ایک ہے، اللہ بے نیاز ہے...", benefit: "فضل: ایک بار پڑھنے سے 1/3 قرآن کا ثواب۔", target: 3 },
        { id: 3, title: "سبحان اللہ", arabic: "سُبْحَانَ اللَّهِ", translation: "ترجمہ: اللہ پاک ہے۔", benefit: "فضل: جنت میں خوبصورت درخت لگایا جاتا ہے۔", target: 33 },
        { id: 4, title: "الحمد للہ", arabic: "الْحَمْدُ لِلَّهِ", translation: "ترجمہ: تمام تعریفیں اللہ کے لیے ہیں۔", benefit: "فضل: نیکیوں کی ترازو کو بھر دیتا ہے۔", target: 33 },
        { id: 5, title: "اللہ اکبر", arabic: "اللَّهُ أَكْبَرُ", translation: "ترجمہ: اللہ سب سے بڑا ہے۔", benefit: "فضل: عظیم ثواب۔", target: 34 }
    ];

    let allDhikrs = [];
    let activeDhikrId = null;
    let counts = JSON.parse(localStorage.getItem('my_counts')) || {};

    function init() {
        const customDhikrs = JSON.parse(localStorage.getItem('custom_dhikrs')) || [];
        allDhikrs = [...defaultDhikrs, ...customDhikrs];
        renderList(allDhikrs);
    }

    function renderList(list) {
        const container = document.getElementById('dhikrListContainer');
        container.innerHTML = '';
        list.forEach(item => {
            const currentCount = counts[item.id] || 0;
            const div = document.createElement('div');
            div.className = 'dhikr-item';
            div.onclick = () => openDhikrDetail(item.id);
            div.innerHTML = `
                <div class="info">
                    <h3>${item.title}</h3>
                    <p>ہدف: ${item.target}</p>
                </div>
                <div class="badge">${currentCount}</div>
            `;
            container.appendChild(div);
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function openDhikrDetail(id) {
        activeDhikrId = id;
        const dhikr = allDhikrs.find(d => d.id === id);
        
        document.getElementById('detailTitle').innerText = dhikr.title;
        document.getElementById('detailArabic').innerText = dhikr.arabic || '';
        document.getElementById('detailTranslation').innerText = dhikr.translation || '';
        document.getElementById('detailBenefit').innerText = dhikr.benefit || '';
        document.getElementById('targetDisplay').innerText = `ہدف: ${dhikr.target}`;
        
        updateCounterDisplay();
        showScreen('detail-screen');
    }

    function handleTap() {
        if (!activeDhikrId) return;
        counts[activeDhikrId] = (counts[activeDhikrId] || 0) + 1;
        localStorage.setItem('my_counts', JSON.stringify(counts));
        
        if (navigator.vibrate) navigator.vibrate(30); // موبائل وائبریشن
        updateCounterDisplay();
        renderList(allDhikrs);
    }

    function updateCounterDisplay() {
        const count = counts[activeDhikrId] || 0;
        document.getElementById('countDisplay').innerText = count;
    }

    function resetCurrentCount() {
        if (!activeDhikrId) return;
        counts[activeDhikrId] = 0;
        localStorage.setItem('my_counts', JSON.stringify(counts));
        updateCounterDisplay();
        renderList(allDhikrs);
    }

    function saveCustomDhikr(e) {
        e.preventDefault();
        const newDhikr = {
            id: Date.now(),
            title: document.getElementById('customTitle').value,
            arabic: document.getElementById('customArabic').value,
            translation: document.getElementById('customTranslation').value,
            benefit: document.getElementById('customBenefit').value,
            target: parseInt(document.getElementById('customTarget').value) || 33
        };

        const customDhikrs = JSON.parse(localStorage.getItem('custom_dhikrs')) || [];
        customDhikrs.push(newDhikr);
        localStorage.setItem('custom_dhikrs', JSON.stringify(customDhikrs));
        
        e.target.reset();
        init();
        showScreen('list-screen');
    }

    function filterList() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allDhikrs.filter(d => d.title.toLowerCase().includes(q));
        renderList(filtered);
    }

    init();
</script>

</body>
</html>
